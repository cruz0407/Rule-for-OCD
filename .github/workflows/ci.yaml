name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: '32 18 * * *'
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: cruz0407/Rule-for-OCD
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set variables
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "REPODIR=$PWD" >> $GITHUB_ENV

      - name: Sync with upstream
        run: |
          git checkout master
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --depth=1 upstream
          mkdir -p ./backup/
          cp -f .gitignore README.md .github/workflows/ci.yaml script/convert.sh ./backup/
          git merge upstream/master --strategy-option theirs --allow-unrelated-histories --no-edit
          cp -f ./backup/.gitignore .gitignore
          cp -f ./backup/README.md README.md
          cp -f ./backup/ci.yaml .github/workflows/ci.yaml
          cp -f ./backup/convert.sh script/convert.sh

      - name: Background run subconverter & http server (nohup + debug)
        run: |
          set -eux
          # 打印当前目录和 rule 目录状态，便于排查
          echo "CWD: $(pwd)"
          echo "rule directory listing:"
          ls -la || true
          echo "rule/ dir listing:"
          ls -la ./rule || true
          ls -la ./rule/Clash || true || true

          # 下载并启动 subconverter
          echo "下载 subconverter..."
          curl -s https://api.github.com/repos/tindy2013/subconverter/releases \
            | grep "browser_download_url.*subconverter_linux64.tar.gz" \
            | head -n 1 \
            | cut -d '"' -f 4 \
            | xargs wget -q -O subconverter_linux64.tar.gz
          tar -xf subconverter_linux64.tar.gz
          chmod +x ./subconverter/subconverter || true

          echo "启动 subconverter（日志 -> /tmp/subconverter.log）"
          nohup ./subconverter/subconverter > /tmp/subconverter.log 2>&1 &
          echo $! > /tmp/subconverter.pid
          sleep 1

          # 启动本地 http server，使用绝对路径以避免目录问题
          ROOT_DIR="$(pwd)/rule"
          if [[ ! -d "$ROOT_DIR" ]]; then
            echo "⚠️ 目录 $ROOT_DIR 不存在，会创建（注意来源同步逻辑）"
            mkdir -p "$ROOT_DIR"
          fi
          echo "启动本地 http server（目录: $ROOT_DIR, 日志 -> /tmp/httpserver.log）"
          nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory "$ROOT_DIR" > /tmp/httpserver.log 2>&1 &
          echo $! > /tmp/httpserver.pid
          sleep 1

          # 输出一些运行时诊断，帮助判断服务是否已启动
          echo "正在查看进程和端口监听（ps | ss）..."
          ps -ef | egrep 'subconverter|http.server|python3' || true
          ss -ltnp | egrep ':25500|:8080' || true
          echo "subconverter log (tail 50):"
          tail -n 50 /tmp/subconverter.log || true
          echo "httpserver log (tail 50):"
          tail -n 50 /tmp/httpserver.log || true

      - name: Install mihomo (CLI only)
        run: |
          set -eux
          echo "下载并安装 mihomo .deb"
          curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases \
            | grep "browser_download_url.*mihomo-linux-amd64-alpha.*.deb" \
            | head -n 1 \
            | cut -d '"' -f 4 \
            | xargs wget -q -O mihomo-linux-amd64-alpha.deb
          sudo apt install --fix-missing -y ./mihomo-linux-amd64-alpha.deb
          echo "mihomo 已安装（仅 CLI，不以后台方式运行）"

      - name: Wait for services (health check, fail-fast with diagnostics)
        run: |
          set -eux
          echo "等待服务就绪（最多 30 秒）..."
          tries=30
          ok=0
          for i in $(seq 1 $tries); do
            # 检查 subconverter(25500)
            if curl -fsS http://127.0.0.1:25500/ >/dev/null 2>&1; then
              sc_ok=1
            else
              sc_ok=0
            fi
            # 检查 http server (8080/Clash/)
            if curl -fsS http://127.0.0.1:8080/Clash/ >/dev/null 2>&1; then
              http_ok=1
            else
              http_ok=0
            fi

            echo "尝试 $i: subconverter=$sc_ok httpserver=$http_ok"
            if [[ $sc_ok -eq 1 && $http_ok -eq 1 ]]; then
              echo "本地服务就绪"
              ok=1
              break
            fi
            sleep 1
          done

          if [[ $ok -ne 1 ]]; then
            echo "⚠️ 服务在 ${tries} 秒内未全部就绪，打印诊断信息并退出（fail-fast）" >&2
            echo "---- /tmp/subconverter.log (tail 200) ----" >&2
            tail -n 200 /tmp/subconverter.log || true
            echo "---- /tmp/httpserver.log (tail 200) ----" >&2
            tail -n 200 /tmp/httpserver.log || true

            echo "---- 进程列表（相关） ----" >&2
            ps -ef | egrep 'subconverter|http.server|python3' || true

            echo "---- 监听端口 ----" >&2
            ss -ltnp | egrep ':25500|:8080' || true
            # Fail-fast，避免产生误导性转换结果
            exit 1
          fi

      - name: start convert
        env:
          # 通知脚本：CI 已负责等待服务，跳过脚本内部的长等待
          WAIT_FOR_SERVICES: 'false'
        run: |
          chmod +x ./script/convert.sh
          ./script/convert.sh

      - name: Upload convert logs
        uses: actions/upload-artifact@v4
        with:
          name: convert-logs
          path: |
            ./convert.log
            ./changed_mrs_files.txt
            ./rule/Clash/*.mrs.log
            /tmp/subconverter.log
            /tmp/httpserver.log

      - name: Commit and Push Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add --all
            git commit -m "${{ env.BUILDTIME }} for OCD"
            git push origin master
          else
            echo "No changes to commit"
          fi
